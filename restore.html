const FS_BASE = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT}/databases/(default)/documents`;

function log(msg, cls='info') {
  const s = document.getElementById('status');
  s.style.display = 'block';
  s.innerHTML += `<div class="${cls}">${msg}</div>`;
}

function toFS(val) {
  if (val === null || val === undefined) return {nullValue: null};
  if (typeof val === 'boolean') return {booleanValue: val};
  if (typeof val === 'number') return Number.isInteger(val) ? {integerValue: String(val)} : {doubleValue: val};
  if (typeof val === 'string') return {stringValue: val};
  if (Array.isArray(val)) return {arrayValue: {values: val.map(toFS)}};
  if (typeof val === 'object') return {mapValue: {fields: Object.fromEntries(Object.entries(val).map(([k,v])=>[k,toFS(v)]))}};
  return {stringValue: String(val)};
}

async function pushCollection(name, data) {
  const url = `${FS_BASE}/${name}/data?key=${FIREBASE_API_KEY}`;
  const body = JSON.stringify({
    fields: {
      items: toFS(data),
      updated: toFS(new Date().toISOString())
    }
  });
  const res = await fetch(url, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return true;
}

    log('❌ Error: ' + e.message, 'err');
    btn.disabled = false;
    btn.textContent = '▶ Try Again';
  }
}
</script>
