<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#1a1a1a"/>
  <!-- Outer ring glow -->
  <circle cx="256" cy="220" r="130" fill="none" stroke="#e8a000" stroke-width="4" opacity="0.3"/>
  
  <!-- Gear body -->
  <circle cx="256" cy="220" r="85" fill="#e8a000"/>
  <circle cx="256" cy="220" r="38" fill="#1a1a1a"/>
  
  <!-- Gear teeth - 8 teeth -->
  <rect x="238" y="108" width="36" height="44" rx="8" fill="#e8a000"/>
  <rect x="238" y="268" width="36" height="44" rx="8" fill="#e8a000"/>
  <rect x="128" y="202" width="44" height="36" rx="8" fill="#e8a000"/>
  <rect x="340" y="202" width="44" height="36" rx="8" fill="#e8a000"/>
  
  <!-- Diagonal teeth -->
  <rect x="155" y="135" width="36" height="44" rx="8" fill="#e8a000" transform="rotate(45 173 157)"/>
  <rect x="321" y="135" width="36" height="44" rx="8" fill="#e8a000" transform="rotate(-45 339 157)"/>
  <rect x="155" y="261" width="36" height="44" rx="8" fill="#e8a000" transform="rotate(-45 173 283)"/>
  <rect x="321" y="261" width="36" height="44" rx="8" fill="#e8a000" transform="rotate(45 339 283)"/>

  <!-- Center dot -->
  <circle cx="256" cy="220" r="16" fill="#e8a000"/>

  <!-- JBS text -->
  <text x="256" y="430" 
    font-family="Arial Black, Helvetica, sans-serif" 
    font-size="96" 
    font-weight="900" 
    fill="#e8a000" 
    text-anchor="middle" 
    letter-spacing="8">JBS</text>
    
  <!-- Thin underline -->
  <rect x="106" y="445" width="300" height="5" rx="3" fill="#e8a000" opacity="0.5"/>
</svg>
